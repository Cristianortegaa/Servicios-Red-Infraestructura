

services:
  dns:
    image: ubuntu/bind9:latest
    container_name: dns-server
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./dns/named.conf.local:/etc/bind/named.conf.local
      - ./dns/db.iesluisvives.org:/etc/bind/db.iesluisvives.org
    dns:
      - 192.168.200.2
    networks:
      vives-net:
        ipv4_address: 192.168.200.2

  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap-server
    environment:
      - LDAP_DOMAIN=iesluisvives.org
      - LDAP_ADMIN_PASSWORD=admin
    dns:
      - 192.168.200.2
    volumes:
      - ./ldap:/var/lib/openldap
    networks:
      vives-net:
        ipv4_address: 192.168.200.50

  backend-daw:
    image: nginx:alpine
    container_name: backend-daw
    volumes:
      - ./backend-daw:/usr/share/nginx/html
    dns:
      - 192.168.200.2
    networks:
      vives-net:
        ipv4_address: 192.168.200.20

  backend-dam:
    image: httpd:alpine
    container_name: backend-dam
    volumes:
      - ./backend-dam:/usr/local/apache2/htdocs
    dns:
      - 192.168.200.2
    networks:
      vives-net:
        ipv4_address: 192.168.200.30

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nginx-proxy
    volumes:
      - ./nginx-proxy/default.conf:/etc/nginx/conf.d/default.conf

    ports:
      - "8080:80"
    networks:
      vives-net:
        ipv4_address: 192.168.200.100

networks:
  vives-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24